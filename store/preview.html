<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AD-Twitcher Store Preview</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: #090b0e; color: #f4f5f7; }
    .stage { position: relative; width: 100%; height: 100%; display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; padding: 72px 88px; background: radial-gradient(circle at 76% 20%, #5d2ea94d, transparent 34%), radial-gradient(circle at 12% 80%, #1e64a72b, transparent 32%), #090b0e; }
    .stage:before { content: ""; position: absolute; inset: 22px; border: 1px solid #ffffff12; border-radius: 28px; pointer-events: none; }
    .copy { max-width: 520px; position: relative; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; color: #cba9ff; font-size: 15px; font-weight: 760; letter-spacing: .12em; text-transform: uppercase; }
    .brand img { width: 38px; height: 38px; border-radius: 11px; }
    h1 { margin: 0; font-size: 64px; line-height: .98; letter-spacing: -.055em; max-width: 540px; }
    .lead { margin: 28px 0 32px; color: #b7bdc8; font-size: 21px; line-height: 1.5; max-width: 500px; }
    .features { display: flex; flex-wrap: wrap; gap: 10px; }
    .feature { padding: 10px 14px; border: 1px solid #343944; border-radius: 999px; background: #12151a; color: #dde0e6; font-size: 14px; }
    .feature:before { content: "✓"; color: #9d63ff; font-weight: 900; margin-right: 8px; }
    .browser { justify-self: end; width: 470px; padding: 14px; border: 1px solid #ffffff1a; border-radius: 24px; background: #14171c; box-shadow: 0 34px 90px #0009; transform: rotate(1deg); }
    .browserbar { height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 7px 12px; }
    .browserbar i { width: 9px; height: 9px; border-radius: 50%; background: #343944; }
    .popup { width: 442px; height: 610px; overflow: hidden; border-radius: 14px; border: 1px solid #2a2f38; background: #0b0d10; }
    .hdr { height: 58px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #242933; }
    .name { display: flex; align-items: center; gap: 10px; font-weight: 760; letter-spacing: -.02em; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #3bd487; box-shadow: 0 0 0 4px #3bd48720; }
    .toggle { width: 36px; height: 20px; border-radius: 99px; background: #8f4cff; padding: 3px; display: flex; justify-content: end; }
    .toggle:after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: white; }
    .tabs { height: 46px; display: grid; grid-template-columns: repeat(4,1fr); border-bottom: 1px solid #242933; }
    .tab { display: grid; place-items: center; color: #858c99; font-size: 12px; font-weight: 650; cursor: pointer; }
    .tab.active { color: #f4f5f7; box-shadow: inset 0 -2px #9d63ff; }
    .content { padding: 18px; }
    .context { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .context b { font-size: 14px; }
    .online { font-size: 11px; color: #70e3a9; background: #13271e; border: 1px solid #24553c; padding: 5px 8px; border-radius: 999px; }
    .sectionhead { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px; color: #a8aeb8; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 760; }
    .sectionhead small { color: #626976; text-transform: none; letter-spacing: 0; font-weight: 500; }
    .stats { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-bottom: 12px; }
    .stat { padding: 14px; border: 1px solid #242933; border-radius: 12px; background: #111419; }
    .stat strong { display: block; font-size: 25px; line-height: 1.1; letter-spacing: -.04em; }
    .stat span { display: block; color: #848b97; margin-top: 5px; font-size: 11px; }
    .card { border: 1px solid #242933; border-radius: 12px; background: #111419; padding: 14px; margin-top: 10px; }
    .cardhead { color: #a8aeb8; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 760; margin-bottom: 11px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { border: 1px solid #3b3150; color: #caa9ff; background: #1a1424; border-radius: 7px; padding: 6px 8px; font-size: 10px; }
    .rows { display: grid; gap: 8px; }
    .row { display: flex; justify-content: space-between; font-size: 12px; color: #9097a2; }
    .row b { color: #f1f2f4; font-weight: 650; }
    .viewer-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
    .metric { border: 1px solid #242933; border-radius: 10px; padding: 12px; }
    .metric b { font-size: 20px; display: block; }
    .metric span { color: #858c97; font-size: 10px; }
    .note { border: 1px solid #3f3451; background: #171220; color: #c9b7df; padding: 12px; border-radius: 10px; font-size: 11px; line-height: 1.45; margin-bottom: 12px; }
    .settings { display: grid; gap: 9px; }
    .setting { display: flex; align-items: center; justify-content: space-between; border: 1px solid #242933; background: #111419; border-radius: 11px; padding: 13px; }
    .setting div b { display: block; font-size: 12px; }
    .setting div span { display: block; color: #777e8a; font-size: 10px; margin-top: 3px; }
    .mini-toggle { width: 30px; height: 17px; border-radius: 20px; background: #8f4cff; padding: 3px; display: flex; justify-content: end; }
    .mini-toggle:after { content: ""; width: 11px; height: 11px; background: white; border-radius: 50%; }
    .foot { position: absolute; left: 88px; bottom: 42px; color: #5f6672; font-size: 12px; }
  </style>
</head>
<body>
  <main class="stage">
    <section class="copy">
      <div class="brand"><img src="../src/icons/icon512.png" alt="">AD-Twitcher 1.0</div>
      <h1 id="headline">Your Twitch routine, handled.</h1>
      <p class="lead" id="lead">Claim available rewards, mute ad breaks and keep an eye on the channels you follow.</p>
      <div class="features" id="features">
        <span class="feature">Local by design</span><span class="feature">12 languages</span><span class="feature">No tracking</span>
      </div>
    </section>
    <section class="browser" aria-label="AD-Twitcher extension preview">
      <div class="browserbar"><i></i><i></i><i></i></div>
      <div class="popup">
        <header class="hdr"><div class="name"><span class="dot"></span>AD-Twitcher</div><span class="toggle"></span></header>
        <nav class="tabs"><span class="tab active" data-tab="status">Status</span><span class="tab" data-tab="settings">Settings</span><span class="tab" data-tab="viewers">Viewers</span><span class="tab">Log</span></nav>
        <div class="content" id="content"></div>
      </div>
    </section>
    <div class="foot">Independent extension for Twitch. Not affiliated with Twitch Interactive, Inc.</div>
  </main>
  <script>
    const views = {
      status: `
        <div class="context"><b>Channel: pestily</b><span class="online">5 modules active</span></div>
        <div class="sectionhead"><span>Lifetime stats</span><small>Tracked since Aug 2026</small></div>
        <div class="stats">
          <div class="stat"><strong>1,284</strong><span>Point bonuses claimed</span></div>
          <div class="stat"><strong>37</strong><span>Drops claimed</span></div>
          <div class="stat"><strong>96</strong><span>Ad breaks muted</span></div>
          <div class="stat"><strong>142</strong><span>Streams opened</span></div>
        </div>
        <div class="card"><div class="cardhead">Active modules</div><div class="chips"><span class="chip">Channel points</span><span class="chip">Drops</span><span class="chip">Ad mute</span><span class="chip">Viewers</span><span class="chip">Live watch</span></div></div>
        <div class="card"><div class="cardhead">Live watcher</div><div class="rows"><div class="row"><span>Last report</span><b>12 s ago</b></div><div class="row"><span>Live in sidebar</span><b>4</b></div><div class="row"><span>Opened by us</span><b>pestily</b></div></div></div>`,
      settings: `
        <div class="context"><b>Settings</b><span class="online">Enabled</span></div>
        <div class="settings">
          <div class="setting"><div><b>Channel points</b><span>Claim the bonus chest automatically</span></div><i class="mini-toggle"></i></div>
          <div class="setting"><div><b>Drops</b><span>Claim completed rewards from inventory</span></div><i class="mini-toggle"></i></div>
          <div class="setting"><div><b>Auto-join</b><span>Open selected channels when they go live</span></div><i class="mini-toggle"></i></div>
          <div class="setting"><div><b>Ad mute</b><span>Mute and cover the player during ads</span></div><i class="mini-toggle"></i></div>
          <div class="setting"><div><b>Viewer metrics</b><span>Show measured chat and viewer activity</span></div><i class="mini-toggle"></i></div>
        </div>`,
      viewers: `
        <div class="context"><b>Viewer metrics</b><span class="online">Measuring</span></div>
        <div class="note"><b>Measured raw values, not bot detection.</b><br>Twitch does not expose a viewer list. These values help you understand activity without making claims about individual viewers.</div>
        <div class="card"><div class="cardhead">Current channel · pestily</div><div class="viewer-grid">
          <div class="metric"><b>5,336</b><span>Viewers</span></div><div class="metric"><b>84.2</b><span>Messages / min</span></div>
          <div class="metric"><b>312</b><span>Unique chatters</span></div><div class="metric"><b>18.7</b><span>Chatters / 1,000</span></div>
          <div class="metric"><b>2.4</b><span>Messages / chatter</span></div><div class="metric"><b>1</b><span>Viewer jumps</span></div>
        </div></div>`,
    };
    const copy = {
      status: ['Your Twitch routine, handled.', 'Claim available rewards, mute ad breaks and keep an eye on the channels you follow.'],
      settings: ['Everything stays under your control.', 'Switch every module on or off and tune AD-Twitcher to the way you watch.'],
      viewers: ['See activity, without guesswork.', 'Measured viewer and chat values with clear limits and no fake detection claims.']
    };
    function render(view) {
      const current = views[view] ? view : 'status';
      document.getElementById('content').innerHTML = views[current];
      document.getElementById('headline').textContent = copy[current][0];
      document.getElementById('lead').textContent = copy[current][1];
      document.querySelectorAll('[data-tab]').forEach(el => el.classList.toggle('active', el.dataset.tab === current));
    }
    const params = new URLSearchParams(location.search);
    render(params.get('view'));
    document.querySelectorAll('[data-tab]').forEach(el => el.addEventListener('click', () => render(el.dataset.tab)));
  </script>
</body>
</html>
